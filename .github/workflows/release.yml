name: Frontend artifact and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Frontend git ref to build; the artifact records the resolved commit
        default: main
        type: string

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            homepage/package-lock.json
            console/package-lock.json
      - name: Build and check the website
        working-directory: homepage
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run verify:browser
          npm run build:dev
          VITE_SITE_BASE=/preview/ VITE_SITE_OUT_DIR=../site/dist/preview VITE_DASHBOARD_URL=/dashboard VITE_ADMIN_URL=/admin npm run verify:browser
      - name: Build and check both cloud consoles
        working-directory: console
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          npm run test:render
          npm run test:browser
          npm run test:hosted-cors
          node scripts/verify-build.mjs
      - name: Package the exact frontend revision
        id: package
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          test -s site/dist/client/index.html
          test -s site/dist/client/zh/index.html
          test -s site/dist/preview/index.html
          test -s site/dist/preview/zh/index.html
          test -s console/dist/dashboard/build-info.json
          test -s console/dist/admin/build-info.json
          mkdir artifact
          printf '%s\n' "$SHA" > artifact/site-sha.txt
          tar -czf "artifact/respire-site-${SHA}.tar.gz" -C site/dist/client .
          tar -czf "artifact/respire-site-preview-${SHA}.tar.gz" -C site/dist/preview .
          tar -czf "artifact/respire-dashboard-${SHA}.tar.gz" -C console/dist/dashboard .
          tar -czf "artifact/respire-admin-${SHA}.tar.gz" -C console/dist/admin .
          cp console/upstream.json artifact/console-upstream.json
          (cd artifact && sha256sum *.tar.gz site-sha.txt console-upstream.json > SHA256SUMS)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ steps.package.outputs.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: website
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish built frontend artifacts without deploying production
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::expected a stable version tag"; exit 1; }
          (cd release-assets && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$RELEASE_TAG" --notes "Checksummed website, Dashboard and Admin assets from the recorded Site revision. Deployment and traffic migration are separate, ordered API-first operations; no production deployment is performed by this release."
