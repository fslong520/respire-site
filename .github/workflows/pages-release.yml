name: Production Pages release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: production-pages-release
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a stable version tag on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a vX.Y.Z version tag'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main

  checks:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  promote:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance the native Pages production branch to the tested tag
        run: |
          git merge-base --is-ancestor origin/prod/pages HEAD
          git push origin "HEAD:refs/heads/prod/pages"
