name: Site CI
on:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  homepage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homepage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homepage/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:browser
      - run: npm run build:dev
      - run: VITE_SITE_BASE=/preview/ VITE_SITE_OUT_DIR=../site/dist/preview VITE_DASHBOARD_URL=/dashboard VITE_ADMIN_URL=/admin npm run verify:browser
  consoles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:render
      - run: npm run test:browser
        env:
          RSRS_UI_SCREENSHOTS: artifacts/passkey-settings
      - name: Upload synthetic Passkey UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: passkey-settings-ui
          path: console/artifacts/passkey-settings
          if-no-files-found: ignore
      - run: npm run test:hosted-cors
      - name: Check built console bundle and Pages files
        run: node scripts/verify-build.mjs
      - name: Assemble the single console bundle with the homepage
        working-directory: .
        run: |
          npm --prefix homepage ci
          npm --prefix homepage run build
          node scripts/assemble-pages.mjs
      - name: Check and assemble the isolated DEV Pages configuration
        working-directory: .
        env:
          CF_PAGES: '1'
          CF_PAGES_BRANCH: develop
          VITE_API_BASE_URL: https://api.dev.rsrs.rs
          VITE_DASHBOARD_URL: https://dash.dev.rsrs.rs
          VITE_ADMIN_URL: https://admin.dev.rsrs.rs
          VITE_HOMEPAGE_URL: https://dev.rsrs.rs
        run: |
          npm --prefix console test
          npm --prefix console run build
          npm --prefix homepage run build
          node scripts/assemble-pages.mjs
  windows-consoles:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: console
    steps:
      - name: Exercise a clean checkout with Windows line-ending conversion
        working-directory: ${{ runner.temp }}
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Check clean console checkout build and Pages files
        run: node scripts/verify-build.mjs
      - name: Assemble Pages on Windows
        working-directory: .
        run: |
          npm --prefix homepage ci
          npm --prefix homepage run build
          node scripts/assemble-pages.mjs

  cleanup-receipt:
    needs: [homepage, consoles, windows-consoles]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Record the completed producer and delivery inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/cleanup_artifacts.py stamp
      - uses: actions/upload-artifact@v4
        with:
          name: cleanup-ready-v1
          path: ${{ runner.temp }}/cleanup-ready.json
          retention-days: 1
          if-no-files-found: ignore
