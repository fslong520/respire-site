name: Site CI
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  homepage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homepage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homepage/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:browser
      - run: npm run build:dev
      - run: VITE_SITE_BASE=/preview/ VITE_SITE_OUT_DIR=../site/dist/preview VITE_DASHBOARD_URL=/dashboard VITE_ADMIN_URL=/admin npm run verify:browser
  consoles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:render
      - run: npm run test:browser
      - run: npm run test:hosted-cors
      - name: Check built provenance and Pages files
        run: node scripts/verify-build.mjs
  windows-consoles:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: console
    steps:
      - name: Exercise a clean checkout with Windows line-ending conversion
        working-directory: ${{ runner.temp }}
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Check clean build provenance and Pages files
        run: node scripts/verify-build.mjs
      - name: Build and assemble the combined Pages project
        working-directory: .
        run: |
          npm --prefix homepage ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix homepage run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/pages-worker.mjs
          node scripts/assemble-pages.mjs
